spring:

  application:
    name: vocash
  datasource:
    url: jdbc:postgresql://localhost:5432/vocash
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
