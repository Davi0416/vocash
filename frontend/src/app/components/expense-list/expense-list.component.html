<div class="section-head">
  <h2>Lançamentos</h2>
  <button class="add-manual" (click)="addManual()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    manual
  </button>
</div>

<div class="list">

  <!-- FORMULÁRIO NOVO ITEM (topo da lista) -->
  <div class="item editing" *ngIf="editingId() === '__new__'">
    <div class="edit-row">
      <input class="edit-name" type="text" [(ngModel)]="editDraft.name" placeholder="Descrição">
      <input class="edit-val" type="number" step="0.01" [(ngModel)]="editDraft.value" placeholder="Valor total">
      <input class="edit-date" type="date" [(ngModel)]="editDraft.date">
      <label class="edit-mini">
        <span>parcelas</span>
        <input class="edit-inst" type="number" min="1" max="360" [(ngModel)]="editDraft.installments">
      </label>
      <select class="edit-cat" [(ngModel)]="editDraft.cat">
        <option *ngFor="let k of catKeys" [value]="k">{{ cats[k].label }}</option>
      </select>
      <div class="edit-actions">
        <button class="btn-cancel" (click)="cancelEdit()">Cancelar</button>
        <button class="btn-save" (click)="saveEdit()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- LISTA DE ITENS EXISTENTES -->
  <ng-container *ngFor="let e of expenseService.expenses(); trackBy: trackById">

    <!-- EDIT MODE -->
    <div class="item editing" *ngIf="editingId() === e.id">
      <div class="edit-row">
        <input class="edit-name" type="text" [(ngModel)]="editDraft.name" placeholder="Descrição">
        <input class="edit-val" type="number" step="0.01" [(ngModel)]="editDraft.value" placeholder="Valor total">
        <input class="edit-date" type="date" [(ngModel)]="editDraft.date">
        <label class="edit-mini">
          <span>parcelas</span>
          <input class="edit-inst" type="number" min="1" max="360" [(ngModel)]="editDraft.installments">
        </label>
        <select class="edit-cat" [(ngModel)]="editDraft.cat">
          <option *ngFor="let k of catKeys" [value]="k">{{ cats[k].label }}</option>
        </select>
        <div class="edit-actions">
          <button class="btn-cancel" (click)="cancelEdit()">Cancelar</button>
          <button class="btn-save" (click)="saveEdit()">Salvar</button>
        </div>
      </div>
    </div>

    <!-- VIEW MODE -->
    <div class="item" *ngIf="editingId() !== e.id">
      <div class="cat-ico" [style.background]="catColor(e.cat)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path [attr.d]="catIcon(e.cat)"/>
        </svg>
      </div>

      <div class="item-main">
        <div class="item-name">{{ e.name }}</div>
        <div class="item-cat">{{ catLabel(e.cat) }} · {{ shortDate(e.date) }}</div>
        <div class="inst-pill" *ngIf="e.installments > 1">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4H4V6.5h16V8z"/>
          </svg>
          {{ e.installments }}× de {{ perInstallment(e) }}
        </div>
      </div>

      <div class="item-val">
        {{ fmt(e.value) }}
        <span class="val-tag" *ngIf="e.installments > 1">total</span>
      </div>

      <div class="item-actions">
        <button class="act edit" (click)="startEdit(e)" aria-label="Editar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
          </svg>
        </button>
        <button class="act del" (click)="delete(e.id)" aria-label="Excluir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
          </svg>
        </button>
      </div>
    </div>

  </ng-container>

  <!-- empty state -->
  <div class="empty" *ngIf="expenseService.expenses().length === 0 && editingId() !== '__new__'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
      <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
      <line x1="12" y1="18" x2="12" y2="22"/>
    </svg>
    <p>Nenhum gasto ainda.<br>Toque no microfone para começar.</p>
  </div>
</div>
