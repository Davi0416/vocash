<div class="scrim" [class.open]="open" (click)="close.emit()"></div>

<div class="settings" [class.open]="open">
  <div class="sh">
    <h3>Ajustes</h3>
    <button class="icon-btn" (click)="close.emit()" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Tema -->
  <div class="set-group">
    <label>Tema</label>
    <div class="seg">
      <button [class.on]="s.theme === 'dark'"  (click)="setTheme('dark')">Escuro</button>
      <button [class.on]="s.theme === 'light'" (click)="setTheme('light')">Claro</button>
    </div>
  </div>

  <!-- Cor de destaque -->
  <div class="set-group">
    <label>Cor de destaque</label>
    <div class="swatches">
      <button
        *ngFor="let a of accents"
        class="sw"
        [class.on]="s.accent === a"
        [style.background]="accentColors[a]"
        (click)="setAccent(a)"
        [attr.aria-label]="a">
      </button>
    </div>
  </div>

  <!-- Cartão · fatura -->
  <div class="set-group">
    <label>Fechamento da fatura</label>
    <div class="day-picker">
      <button
        *ngFor="let d of days"
        [class.on]="s.fechamento === d"
        (click)="setFechamento(d)"
        [attr.aria-label]="'Fecha dia ' + d">{{ d }}</button>
    </div>
  </div>

  <div class="set-group">
    <label>Vencimento da fatura</label>
    <div class="day-picker">
      <button
        *ngFor="let d of days"
        [class.on]="s.vencimento === d"
        (click)="setVencimento(d)"
        [attr.aria-label]="'Vence dia ' + d">{{ d }}</button>
    </div>
  </div>

  <div class="invoice-preview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    <span>{{ invoicePreview() }}</span>
  </div>

  <!-- Mostrar resumo -->
  <div class="set-group">
    <div class="toggle-row">
      <span>Mostrar resumo</span>
      <button class="tg" [class.on]="s.showChart" (click)="toggleChart()" aria-label="Alternar resumo"></button>
    </div>
  </div>

  <p class="set-note">
    As parcelas se distribuem pelos meses seguintes conforme o dia de fechamento configurado acima.
    Alterar o fechamento ou vencimento reflete imediatamente no calendário e nos totais de fatura.
  </p>
</div>
