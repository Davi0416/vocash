<section class="hero" [class.listening]="listening">
  <div class="total-label">Total de gastos</div>

  <div class="total-value">
    {{ totalParts.integer }}<span class="cents">{{ totalParts.cents }}</span>
  </div>

  <div class="total-sub"><b>{{ count }}</b> lançamentos registrados</div>

  <div class="month-pill">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    <span class="mp-label">A pagar em <b>{{ currentMonth }}</b></span>
    <span class="mp-val">{{ monthInvoice }}</span>
  </div>

  <!-- mic button -->
  <div class="mic-wrap">
    <span class="ring"></span>
    <span class="ring"></span>
    <span class="ring"></span>
    <button class="mic-btn" (click)="toggleMic()" aria-label="Gravar gasto">
      <svg *ngIf="!listening" class="ico-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
      </svg>
      <svg *ngIf="listening" class="ico-stop" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="6" width="12" height="12" rx="3"/>
      </svg>
    </button>
  </div>

  <div class="mic-hint" [innerHTML]="hint()"></div>

  <!-- capture bar -->
  <div class="capture">
    <div class="capture-inner">
      <div class="eq">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <input
        type="text"
        [ngModel]="phrase()"
        (ngModelChange)="phrase.set($event)"
        (keydown.enter)="onEnter()"
        placeholder="ex: gastei 50 reais no mercado"
        autocomplete="off">
      <button class="send-btn" (click)="send()" aria-label="Confirmar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </button>
    </div>
    <div class="chips">
      <button class="chip" *ngFor="let ex of examples" (click)="useExample(ex)">{{ ex }}</button>
    </div>
  </div>
</section>
